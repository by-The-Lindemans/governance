name: Auto-Close Expired Consent Requests (restore280 Institute)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-close-expired:
    runs-on: ubuntu-latest

    # For issue_comment events, only run if the comment is on a pull request.
    # Scheduled and manually dispatched runs always proceed.
    if: |
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: .github
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Close pull requests past their response deadline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For issue_comment events, check only the commented-on PR rather
          # than rescanning every open PR.
          TARGET_PR_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || '' }}
        working-directory: .github
        run: node autoCloseExpired.js
